# Every repo in the org is managed, including `.github`. safe-settings excludes
# `admin`, `.github` and `safe-settings` by default when this file is absent --
# an empty exclude list is what overrides that default, so removing the file
# would silently restore it.
#
# Archived repos belong here if any are ever created: they are read-only, and a
# failed write to one fails the entire sync.
restrictedRepos:
  exclude: []
