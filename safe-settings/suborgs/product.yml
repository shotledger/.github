# The product repo.
suborgrepos:
  - shotledger

# Workaround for safe-settings shared-object mutation bug:
# Without a suborg entry, all repos share the same repoConfig reference via
# Object.assign() mutation. Adding a suborg causes mergeDeep({}, ...) which
# creates a fresh object per repo, giving each repo its correct name.
#
# Auto-merge is on for this repo only: `.github` stays private, where the free
# plan has no auto-merge. Like the rulesets, it needs shotledger public.
repository:
  allow_auto_merge: true

# Repository rulesets, so they need the repo public: on a private repo on the free
# plan it fails the whole sync.
rulesets:
  - name: protect-main
    target: branch
    enforcement: active
    conditions:
      ref_name:
        # release/* and hotfix/* too: they are the other refs the `release`
        # environment deploys from, and it accepts protected branches only.
        include: ["~DEFAULT_BRANCH", "refs/heads/release/*", "refs/heads/hotfix/*"]
        exclude: []
    bypass_actors:
      # Sole-maintainer org: the review requirement below is real four-eyes only
      # once a second reviewer exists; until then the org admin bypasses it.
      # Renovate gets no bypass: renovate-approve satisfies the review, and every
      # check stays enforced on its PRs.
      - actor_id: 1
        actor_type: OrganizationAdmin
        bypass_mode: always
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: pull_request
        parameters:
          required_approving_review_count: 1
          dismiss_stale_reviews_on_push: true
          require_code_owner_review: false
          require_last_push_approval: false
          # Required by the schema; omitting it fails validation.
          required_review_thread_resolution: true
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          required_status_checks:
            # Every check that runs on every PR. Path-filtered workflows (docs,
            # e2e) stay out: a required check that does not run blocks the PR
            # forever. Never add `renovate/stability-days`; it deadlocks merges.
            #
            # integration_id pins the app: 15368 is GitHub Actions, 1861 the DCO
            # App. A check of the same name from another app cannot satisfy it.
            - context: check
              integration_id: 15368
            - context: DCO
              integration_id: 1861
            # CLA Assistant posts a commit status through an OAuth app, not a
            # GitHub App, so there is no integration_id to pin.
            - context: license/cla

  # The git tag is the release version (release.yml), so a pushed tag must never
  # move or disappear. Creating one stays open: release.yml creates them.
  - name: protect-tags
    target: tag
    enforcement: active
    conditions:
      ref_name:
        include: ["~ALL"]
        exclude: []
    bypass_actors: []
    rules:
      - type: deletion
      - type: update

# safe-settings deletes any environment not listed here, so both existing ones
# are declared. A required reviewer needs the repo public on the free plan.
environments:
  # The approval gate in release.yml's `build` job. Self-review is allowed: the
  # maintainer who dispatches a release is normally the one who approves it.
  # Deploys only from branches a ruleset protects (protect-main above), never
  # from a tag.
  - name: release
    wait_timer: 0
    prevent_self_review: false
    reviewers:
      - id: 1577689 # jimisola
        type: User
    deployment_branch_policy:
      protected_branches: true
      custom_branch_policies: false

  # GitHub Pages deployments; kept as it is.
  - name: github-pages
    wait_timer: 0
    deployment_branch_policy: ~

# Generated from shotledger/shotledger's live labels on 2026-10-14, all of them.
# Referenced by the issue templates, Renovate and hand triage; GitHub issue
# forms and Renovate silently drop labels that do not exist.
#
# WARNING: safe-settings is declarative about labels -- a label that exists on a
# repo but is absent from this list is DELETED on the next sync unless it
# matches an `exclude` pattern. Do not prune entries here to tidy the file.
labels:
  include:
    - name: "accessibility"
      color: "f143ab"
      description: "Barrier affecting people with disabilities"
    - name: "blocked"
      color: "b60205"
      description: "Waiting on something else; do not start yet"
    - name: "bot-renovate"
      color: "ededed"
      description: "Renovate-authored PR"
    - name: "bot-renovate-rebase"
      color: "0e8a16"
      description: "Ask Renovate to rebase this PR"
    - name: "bot-renovate-stop"
      color: "d93f0b"
      description: "Stop Renovate updating this PR"
    - name: "bug"
      color: "d73a4a"
      description: "Something isn't working"
    - name: "dependencies"
      color: "0366d6"
      description: "Dependency update"
    - name: "documentation"
      color: "0075ca"
      description: "Improvements or additions to documentation"
    - name: "duplicate"
      color: "cfd3d7"
      description: "This issue or pull request already exists"
    - name: "e2e"
      color: "ededed"
      description: ""
    - name: "enhancement"
      color: "a2eeef"
      description: "New feature or request"
    - name: "good first issue"
      color: "7057ff"
      description: "Good for newcomers"
    - name: "help wanted"
      color: "008672"
      description: "Extra attention is needed"
    - name: "invalid"
      color: "e4e669"
      description: "This doesn't seem right"
    - name: "needs-triage"
      color: "ededed"
      description: "Not yet understood or classified; needs more information or investigation"
    - name: "question"
      color: "d876e3"
      description: "Further information is requested"
    - name: "renovate-version-digest"
      color: "ededed"
      description: "Digest update"
    - name: "renovate-version-lockfile"
      color: "ededed"
      description: ""
    - name: "renovate-version-major"
      color: "d93f0b"
      description: "Major version bump"
    - name: "renovate-version-minor"
      color: "fbca04"
      description: "Minor version bump"
    - name: "renovate-version-patch"
      color: "c2e0c6"
      description: "Patch version bump"
    - name: "renovate-version-pin"
      color: "ededed"
      description: "Pin action"
    - name: "security"
      color: "b60205"
      description: "Security-relevant change"
    - name: "wontfix"
      color: "ffffff"
      description: "This will not be worked on"
